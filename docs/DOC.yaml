cs:
  perex: 'Tento dokument popisuje datový formát, používaný pro poskytování obecných dopravních informací o situaci na silniční síti ČR: nehod, překážek, kolon, uzavírek a omezení, prací na silnici, akcí správce komunikace a vlivů počasí na sjízdnost. Každá událost se skládá z jednoho nebo více záznamů s vlastní polohou a dobou platnosti; poloha se popisuje současně několika metodami (ALERT-C, OpenLR, úseky sítě Global Network a průběh v souřadnicích WGS-84). Uzavírky a omezení publikuje samostatně také formát cz-ndic_d2-restrictions, který je podmnožinou tohoto formátu. Formát vychází z publikace SituationPublication modelu DATEX II 3.7 a nepoužívá národní rozšíření.'
  keywords: DATEX II, NDIC, SituationPublication
en:
  perex: 'This document describes the data format used to provide general traffic information about the situation on the road network of the Czech Republic: accidents, obstructions, queues, closures and restrictions, roadworks, road operator actions and weather effects on driving conditions. Each event consists of one or more records with their own location and validity; the location is described by several methods at once (ALERT-C, OpenLR, Global Network sections and the course in WGS-84 coordinates). Closures and restrictions are also published separately by the format cz-ndic_d2-restrictions, a subset of this format. The format is based on the SituationPublication of the DATEX II 3.7 model and uses no national extension.'
  keywords: DATEX II, NDIC, SituationPublication
tables:
  scope: samples
